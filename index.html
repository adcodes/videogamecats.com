<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>videogamecats.com</title>
<meta name="description" content="A personal collection of cats spotted in videogames.">

<!-- Favicon -->
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 28 28'><rect width='28' height='28' rx='5' fill='%23111113'/><rect x='2' y='0' width='4' height='4' fill='%237db88a'/><rect x='3' y='1' width='2' height='2' fill='%231a2e1d'/><rect x='22' y='0' width='4' height='4' fill='%237db88a'/><rect x='23' y='1' width='2' height='2' fill='%231a2e1d'/><rect x='2' y='4' width='24' height='18' fill='%237db88a'/><rect x='4' y='5' width='20' height='1' fill='%235a9966'/><rect x='6' y='8' width='5' height='5' fill='%23ffffff'/><rect x='17' y='8' width='5' height='5' fill='%23ffffff'/><rect x='8' y='9' width='3' height='3' fill='%23111113'/><rect x='19' y='9' width='3' height='3' fill='%23111113'/><rect x='8' y='9' width='1' height='1' fill='%23ffffff'/><rect x='19' y='9' width='1' height='1' fill='%23ffffff'/><rect x='12' y='14' width='4' height='2' fill='%231a2e1d'/><rect x='13' y='14' width='2' height='1' fill='%232d5c35'/><rect x='10' y='16' width='2' height='1' fill='%231a2e1d'/><rect x='16' y='16' width='2' height='1' fill='%231a2e1d'/><rect x='0' y='14' width='5' height='1' fill='%23ffffff'/><rect x='0' y='16' width='5' height='1' fill='%23ffffff'/><rect x='23' y='14' width='5' height='1' fill='%23ffffff'/><rect x='23' y='16' width='5' height='1' fill='%23ffffff'/><rect x='6' y='22' width='16' height='2' fill='%235a9966'/></svg>">

<!-- Open Graph -->
<meta property="og:type" content="website">
<meta property="og:url" content="https://videogamecats.com">
<meta property="og:title" content="VIDEOGAMECATS">
<meta property="og:description" content="A personal collection of cats spotted in videogames.">
<meta property="og:image" content="https://videogamecats.com/og.jpg">
<meta property="og:site_name" content="videogamecats.com">

<!-- Twitter/X card -->
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="VIDEOGAMECATS">
<meta name="twitter:description" content="A personal collection of cats spotted in videogames.">
<meta name="twitter:image" content="https://videogamecats.com/og.jpg">
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #111113;
  --surface: #1a1a1e;
  --surface2: #222227;
  --border: rgba(255,255,255,0.07);
  --border-hover: rgba(255,255,255,0.18);
  --text: #ffffff;
  --text-muted: #a0a0a8;
  --text-dim: #444449;
  --accent: #7db88a;
  --accent-dim: rgba(125,184,138,0.1);
  --accent-border: rgba(125,184,138,0.3);
  --radius: 6px;
  --radius-lg: 10px;
}

html { scroll-behavior: smooth; }

body {
  font-family: 'DM Mono', monospace;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  font-size: 15px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  background-image:
    linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
  background-size: 48px 48px;
}

/* HEADER */
header {
  padding: 44px 48px 0;
  max-width: 1400px;
  margin: 0 auto;
}

.wordmark {
  font-family: 'Bungee', sans-serif;
  font-size: 30px;
  color: var(--text);
  letter-spacing: 0.03em;
  line-height: 1;
  text-transform: uppercase;
}

.wordmark em { font-style: normal; color: var(--accent); }

.wordmark-sub {
  font-size: 13px;
  color: var(--text-muted);
  letter-spacing: 0.06em;
  margin-top: 8px;
  font-weight: 300;
}

.divider {
  max-width: 1400px;
  margin: 26px auto 0;
  padding: 0 48px;
  border-bottom: 1px solid var(--border);
}

/* CONTROLS */
.controls {
  max-width: 1400px;
  margin: 0 auto;
  padding: 18px 48px;
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}

.tag-btn {
  font-family: 'DM Mono', monospace;
  font-size: 13px;
  letter-spacing: 0.03em;
  background: none;
  border: 1px solid var(--border);
  color: var(--text-muted);
  padding: 8px 16px;
  border-radius: 100px;
  cursor: pointer;
  transition: border-color 0.15s, color 0.15s, background 0.15s;
  white-space: nowrap;
  -webkit-tap-highlight-color: transparent;
}

.tag-btn:hover { border-color: var(--border-hover); color: var(--text); }

.tag-btn.active {
  background: var(--accent);
  border-color: var(--accent);
  color: #0e1f12;
}

.tag-count { opacity: 0.55; margin-left: 3px; }

.spacer { flex: 1; min-width: 8px; }

.search-wrap { position: relative; }

.search-icon {
  position: absolute;
  left: 11px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--text-dim);
  pointer-events: none;
  font-size: 14px;
}

.search-input {
  font-family: 'DM Mono', monospace;
  font-size: 14px;
  background: var(--surface);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 8px 14px 8px 34px;
  border-radius: var(--radius);
  outline: none;
  width: 200px;
  transition: border-color 0.2s;
}

.search-input:focus { border-color: var(--border-hover); }
.search-input::placeholder { color: var(--text-dim); }

/* GALLERY */
.gallery-wrap {
  max-width: 1400px;
  margin: 0 auto;
  padding: 0 48px 80px;
}

.gallery-count {
  font-size: 13px;
  color: var(--text-dim);
  letter-spacing: 0.06em;
  margin-bottom: 18px;
}

#gallery {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
  gap: 1px;
  background: var(--border);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  overflow: hidden;
}

.card {
  background: var(--bg);
  cursor: pointer;
  transition: background 0.15s;
  display: flex;
  flex-direction: column;
  -webkit-tap-highlight-color: transparent;
}

.card:hover { background: var(--surface); }

.card-img {
  width: 100%;
  aspect-ratio: 16/9;
  object-fit: cover;
  display: block;
}

.card-body {
  padding: 16px 18px 18px;
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.card-game {
  font-size: 12px;
  color: var(--accent);
  letter-spacing: 0.07em;
  text-transform: uppercase;
}

.card-desc {
  font-size: 15px;
  color: var(--text-muted);
  font-weight: 300;
  line-height: 1.5;
  flex: 1;
}



/* STATES */
.state-msg {
  grid-column: 1/-1;
  padding: 72px 20px;
  text-align: center;
  font-size: 13px;
  color: var(--text-muted);
}

/* LIGHTBOX */
.lightbox {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.93);
  z-index: 300;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  gap: 20px;
  padding: 40px;
  cursor: zoom-out;
}

.lightbox.open { display: flex; }

.lightbox img {
  max-width: min(960px, 90vw);
  max-height: 74vh;
  object-fit: contain;
  border-radius: var(--radius);
  cursor: default;
}

.lb-caption { text-align: center; cursor: default; }
.lb-game { font-size: 12px; color: var(--accent); letter-spacing: 0.09em; text-transform: uppercase; margin-bottom: 6px; }
.lb-desc { font-size: 15px; color: var(--text-muted); font-weight: 300; }

.lb-close {
  position: fixed;
  top: 22px;
  right: 26px;
  font-size: 13px;
  color: var(--text-dim);
  letter-spacing: 0.06em;
  pointer-events: none;
}

/* FOOTER */
footer {
  border-top: 1px solid var(--border);
  padding: 20px 48px;
  max-width: 1400px;
  margin: 0 auto;
  font-size: 13px;
  color: var(--text-dim);
  letter-spacing: 0.04em;
}

@media (max-width: 680px) {
  header, .divider, .controls, .gallery-wrap, footer { padding-left: 20px; padding-right: 20px; }
  header { padding-top: 28px; }

  .wordmark { font-size: 24px; }

  /* Tags row: scrollable single line on mobile */
  .controls {
    padding-top: 16px;
    padding-bottom: 16px;
    flex-wrap: nowrap;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
    gap: 8px;
  }
  .controls::-webkit-scrollbar { display: none; }

  /* Search sits below tags on mobile */
  .spacer { display: none; }
  .search-wrap { order: -1; flex-shrink: 0; }
  .search-input { width: 100%; }
  .controls { flex-wrap: wrap; }
  .search-wrap { width: 100%; order: 0; margin-bottom: 4px; }
  .search-input { width: 100%; }
  .tag-btn { flex-shrink: 0; }

  #gallery { grid-template-columns: 1fr; }

  /* Bigger tap targets on cards */
  .card-body { padding: 14px 16px 16px; }

  /* Lightbox close hint hidden on mobile — tap anywhere works */
  .lb-close { display: none; }
}
</style>
</head>
<body>

<header>
  <div class="wordmark">videogame<em>cats</em></div>
  <div class="wordmark-sub">cats spotted in videogames</div>
</header>
<div class="divider"></div>

<div class="controls" id="controls">
  <button class="tag-btn active" data-game="" onclick="selectTag(this)">all <span class="tag-count" id="countAll"></span></button>
  <div class="spacer"></div>
  <div class="search-wrap">
    <span class="search-icon">⌕</span>
    <input class="search-input" type="text" id="searchInput" placeholder="search…" oninput="render()">
  </div>
</div>

<div class="gallery-wrap">
  <div class="gallery-count" id="galleryCount"></div>
  <div id="gallery">
    <div class="state-msg" id="stateMsg">loading…</div>
  </div>
</div>

<footer>videogamecats.com</footer>

<!-- LIGHTBOX -->
<div class="lightbox" id="lightbox" onclick="closeLightbox()">
  <span class="lb-close">click or esc to close</span>
  <img id="lbImg" src="" alt="" onclick="event.stopPropagation()">
  <div class="lb-caption">
    <div class="lb-game" id="lbGame"></div>
    <div class="lb-desc" id="lbDesc"></div>
  </div>
</div>

<script>
let allCards = [];
let activeGame = '';

async function loadData() {
  try {
    const res = await fetch('data.json?v=' + Date.now());
    if (!res.ok) throw new Error('not found');
    allCards = await res.json();
  } catch(e) {
    document.getElementById('stateMsg').textContent = 'could not load data.json';
    return;
  }
  render();
}

function gameCounts() {
  return allCards.reduce((m,c) => { m[c.game]=(m[c.game]||0)+1; return m; }, {});
}

function buildTags() {
  const ctrl = document.getElementById('controls');
  [...ctrl.querySelectorAll('.tag-btn[data-game]:not([data-game=""])')].forEach(e=>e.remove());
  const spacer = ctrl.querySelector('.spacer');
  const counts = gameCounts();
  document.getElementById('countAll').textContent = allCards.length;
  Object.keys(counts).sort().forEach(g => {
    const btn = document.createElement('button');
    btn.className = 'tag-btn' + (activeGame===g ? ' active' : '');
    btn.dataset.game = g;
    btn.onclick = function(){ selectTag(this); };
    btn.innerHTML = `${g} <span class="tag-count">${counts[g]}</span>`;
    ctrl.insertBefore(btn, spacer);
  });
  document.querySelector('.tag-btn[data-game=""]').className = 'tag-btn' + (activeGame==='' ? ' active' : '');
}

function selectTag(btn) {
  activeGame = btn.dataset.game;
  render();
}

function filtered() {
  const q = document.getElementById('searchInput').value.toLowerCase();
  return allCards.filter(c =>
    (!activeGame || c.game === activeGame) &&
    (!q || c.game.toLowerCase().includes(q) || (c.desc||'').toLowerCase().includes(q))
  );
}

function render() {
  buildTags();
  const items = filtered();
  const gallery = document.getElementById('gallery');
  const msg = document.getElementById('stateMsg');
  [...gallery.querySelectorAll('.card')].forEach(e=>e.remove());

  document.getElementById('galleryCount').textContent =
    items.length === allCards.length
      ? `${allCards.length} screenshot${allCards.length !== 1 ? 's' : ''}`
      : `${items.length} of ${allCards.length}`;

  if (items.length === 0) {
    msg.textContent = allCards.length === 0 ? 'no screenshots yet' : 'no matches';
    msg.style.display = 'block';
    return;
  }
  msg.style.display = 'none';

  [...items].reverse().forEach(c => {
    const el = document.createElement('div');
    el.className = 'card';
    el.onclick = () => openLightbox(c);
    const dateStr = c.date
      ? new Date(c.date).toLocaleDateString('en-GB', {day:'2-digit', month:'short', year:'numeric'})
      : '';
    el.innerHTML = `<img class="card-img" src="${c.img}" alt="${c.desc||c.game}" loading="lazy">`;
    const body = document.createElement('div');
    body.className = 'card-body';
    body.innerHTML = `<div class="card-game">${c.game}</div>`
      + (c.desc ? `<div class="card-desc">${c.desc}</div>` : '');
    el.appendChild(body);
    gallery.insertBefore(el, msg);
  });
}

function openLightbox(c) {
  document.getElementById('lbImg').src = c.img;
  document.getElementById('lbGame').textContent = c.game;
  document.getElementById('lbDesc').textContent = c.desc || '';
  document.getElementById('lightbox').classList.add('open');
}

function closeLightbox() {
  document.getElementById('lightbox').classList.remove('open');
}

document.addEventListener('keydown', e => { if(e.key==='Escape') closeLightbox(); });

loadData();
</script>
</body>
</html>
