<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 — videogamecats.com</title>
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">

<link href="https://fonts.googleapis.com/css2?family=Bungee&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'DM Mono', monospace;
  background: #111113;
  color: #ffffff;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 40px 20px;
  background-image:
    linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
  background-size: 48px 48px;
  -webkit-font-smoothing: antialiased;
}

.wordmark {
  font-family: 'Bungee', sans-serif;
  font-size: 24px;
  letter-spacing: 0.03em;
  text-transform: uppercase;
  margin-bottom: 48px;
}

.wordmark em { font-style: normal; color: #7db88a; }

.code {
  font-family: 'Bungee', sans-serif;
  font-size: 72px;
  color: #7db88a;
  line-height: 1;
  margin-bottom: 16px;
}

.message {
  font-size: 15px;
  color: #a0a0a8;
  font-weight: 300;
  margin-bottom: 32px;
}

a {
  font-size: 13px;
  color: #ffffff;
  text-decoration: none;
  border-bottom: 1px solid rgba(255,255,255,0.2);
  padding-bottom: 2px;
  transition: border-color 0.15s;
}

a:hover { border-color: #7db88a; color: #7db88a; }
</style>
</head>
<body>
  <div class="wordmark">videogame<em>cats</em></div>
